<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CueZy-Web | Professional Web Sampler</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: rgba(20, 22, 28, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            
            /* Neon Colors for Pad states */
            --color-idle: #4b5563;
            --color-ready: #3b82f6;    /* Neon Blue */
            --color-playing: #10b981;  /* Neon Green */
            --color-selecting: #fbbf24;/* Amber Yellow */
            --color-error: #ef4444;    /* Crimson Red */
            
            --glow-ready: 0 0 15px rgba(59, 130, 246, 0.4);
            --glow-playing: 0 0 25px rgba(16, 185, 129, 0.6);
            --glow-selecting: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header CSS */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(13, 14, 18, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--color-ready), var(--color-playing));
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .global-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .preset-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .preset-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .header-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px);
        }

        /* Sampler Pads Grid Area */
        .sampler-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.1);
        }

        /* Pad Styling */
        .pad {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
        }

        /* Neon glow states based on status */
        .pad.status-idle {
            border-color: rgba(255, 255, 255, 0.05);
        }
        
        .pad.status-ready {
            border-color: var(--color-ready);
            background: rgba(59, 130, 246, 0.02);
            box-shadow: inset 0 0 15px rgba(59, 130, 246, 0.1), var(--glow-ready);
        }

        .pad.status-playing {
            border-color: var(--color-playing);
            background: rgba(16, 185, 129, 0.05);
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.2), var(--glow-playing);
        }

        .pad.status-selecting {
            border-color: var(--color-selecting);
            background: rgba(251, 191, 36, 0.03);
            box-shadow: inset 0 0 15px rgba(251, 191, 36, 0.1), var(--glow-selecting);
        }

        .pad.status-error {
            border-color: var(--color-error);
            background: rgba(239, 68, 68, 0.03);
            box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.1);
        }

        /* Blinking animations for paused and fading states */
        .pad.paused-blink {
            animation: slow-blink-anim 1.5s infinite ease-in-out;
        }

        .pad.fading-blink {
            animation: fast-blink-anim 0.4s infinite ease-in-out;
        }

        @keyframes slow-blink-anim {
            0%, 100% {
                border-color: var(--color-playing);
                box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.2), var(--glow-playing);
                background: rgba(16, 185, 129, 0.05);
            }
            50% {
                border-color: rgba(16, 185, 129, 0.2);
                box-shadow: inset 0 0 5px rgba(16, 185, 129, 0.05), 0 0 5px rgba(16, 185, 129, 0.1);
                background: rgba(16, 185, 129, 0.01);
            }
        }

        @keyframes fast-blink-anim {
            0%, 100% {
                border-color: var(--color-playing);
                box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.2), var(--glow-playing);
                background: rgba(16, 185, 129, 0.05);
            }
            50% {
                border-color: rgba(16, 185, 129, 0.2);
                box-shadow: inset 0 0 5px rgba(16, 185, 129, 0.05), 0 0 5px rgba(16, 185, 129, 0.1);
                background: rgba(16, 185, 129, 0.01);
            }
        }

        /* Pad content */
        .pad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .pad-number {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-muted);
            line-height: 1;
            transition: color 0.2s;
        }

        .pad.status-ready .pad-number { color: var(--color-ready); }
        .pad.status-playing .pad-number { color: var(--color-playing); }
        .pad.status-selecting .pad-number { color: var(--color-selecting); }

        .pad-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .pad-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 15px 0;
            z-index: 2;
        }

        .pad-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .pad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .pad-time {
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            color: var(--text-muted);
        }

        .pad-mode-indicator {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Pad progress bar overlay */
        .pad-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--color-playing);
            width: 0%;
            transition: width 0.05s linear;
            z-index: 1;
            box-shadow: 0 0 8px var(--color-playing);
        }

        /* Sidebar Control Panel */
        .control-panel {
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 25px;
            overflow-y: auto;
            gap: 24px;
        }

        .panel-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        /* File Dropzone */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.2);
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--color-selecting);
            background: rgba(245, 158, 11, 0.05);
        }

        .dropzone-icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .dropzone-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Control groups */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Play Mode Buttons Grid */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-muted);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .mode-btn.active {
            background: rgba(245, 158, 11, 0.15);
            border-color: var(--color-selecting);
            color: var(--color-selecting);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);
        }

        .mode-desc {
            font-size: 9px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* Slider Controls */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .slider-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
        }

        .slider-value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--color-selecting);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Pan knob representation */
        .pan-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .pan-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Bottom Help Overlay / Tips */
        .tips-area {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            padding: 15px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .tips-area strong {
            color: #ffffff;
        }

        /* Utilities */
        .hidden {
            display: none !important;
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Select element styling */
        select.control-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-color);
            outline: none;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            transition: border-color 0.2s;
        }
        select.control-select:focus {
            border-color: var(--color-selecting);
        }
        select.control-select option {
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* Multi-View and Fullscreen Layouts */
        body {
            overflow: hidden;
        }

        .workspace {
            position: relative;
            width: 100vw;
            height: calc(100vh - 70px);
            display: block; /* FlexからBlockに変更してオーバーレイを重ねやすく */
            padding: 0;
            gap: 0;
        }

        /* 3x3 Sampler Grid Fullscreen */
        .sampler-area {
            width: 100%;
            height: 100%;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 12px;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Header Layout Updates */
        header {
            height: 70px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .global-controls {
            gap: 15px;
            display: flex;
            align-items: center;
        }

        /* Fader/Edit Mode Toggle active styles */
        .header-btn.toggle-active {
            background: rgba(245, 158, 11, 0.2) !important;
            border-color: var(--color-selecting) !important;
            color: var(--color-selecting) !important;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .header-btn.fader-active {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--color-playing) !important;
            color: var(--color-playing) !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
        }

        /* Edit mode target glow for pads */
        .edit-waiting .pad {
            border: 2px dashed rgba(245, 158, 11, 0.4);
            animation: edit-glow-anim 1.5s infinite alternate;
            cursor: pointer;
        }
        @keyframes edit-glow-anim {
            from { border-color: rgba(245, 158, 11, 0.2); box-shadow: 0 0 5px rgba(245, 158, 11, 0.1); }
            to { border-color: var(--color-selecting); box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
        }

        /* Edit Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .modal-content {
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            width: 500px;
            max-width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .modal-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--color-selecting);
            letter-spacing: 1px;
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
        }

        /* Loop Mode Toggle Switch style */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Fader View Overlay Layout */
        .fader-view-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #08080a;
            z-index: 10;
            display: flex;
            flex-direction: row;
            padding: 20px;
            box-sizing: border-box;
            gap: 15px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Slide up transition for fader view */
        .fader-view-overlay.hidden {
            transform: translateY(100%);
            display: flex !important; /* スライドアウトアニメーション維持のため */
            pointer-events: none;
        }

        .fader-channels-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
            height: 100%;
            box-sizing: border-box;
        }

        .fader-channel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 10%;
            height: 100%;
            justify-content: space-between;
            border-right: 1px dashed rgba(255, 255, 255, 0.03);
        }
        .fader-channel:last-child {
            border-right: none;
        }

        .fader-channel-num {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .fader-pan-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .fader-pan-label {
            font-size: 9px;
            color: var(--text-muted);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        .fader-pan-slider {
            width: 80%;
            height: 4px;
        }

        .fader-slider-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0;
            width: 100%;
        }

        /* Vertical Slider representation */
        .fader-slider-wrap input[type="range"] {
            transform: rotate(-90deg);
            width: 180px; /* 縦の長さ */
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 3px;
        }
        /* Custom thumb to look more like physical fader */
        .fader-slider-wrap input[type="range"]::-webkit-slider-thumb {
            width: 24px;
            height: 14px;
            border-radius: 3px;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .fader-cue-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 11px;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fader-cue-btn.status-ready {
            border-color: var(--color-ready);
            color: var(--color-ready);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .fader-cue-btn.status-playing {
            border-color: var(--color-playing);
            color: var(--color-playing);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        /* Right panel for Master volume on fader view */
        .fader-master-container {
            width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px 10px;
            box-sizing: border-box;
        }
        .fader-master-title {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;

</head>

                            </div>
                            <input type="range" id="slider-fadeout" min="0" max="5" step="0.1" value="0">
                        </div>
                    </div>

                    <!-- Delay -->
                    <div class="slider-row">
                        <div class="slider-wrap">
                            <div class="slider-header">
                                <span>DELAY</span>
                                <span class="slider-value" id="val-delay">0.0s</span>

    <!-- JavaScript logic -->
    <script>
        // --- Database (IndexedDB) Configuration ---
        const DB_NAME = 'CueZyWebDB';
        const DB_VERSION = 1;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject('Database error: ' + e.target.errorCode);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const dbInstance = e.target.result;
                    // Create settings store for pads
                    dbInstance.createObjectStore('pads', { keyPath: 'id' });
                };
            });
        }

        function savePadToDB(padData) {
            if (!db) return;
            const transaction = db.transaction(['pads'], 'readwrite');
            const store = transaction.objectStore('pads');
            
            // Exclude temporary AudioBuffer from database saving
            const dataToSave = {
                id: padData.id,
                bankId: padData.bankId,
                fileName: padData.fileName,
                fileBlob: padData.fileBlob,
                volume: padData.volume,
                pan: padData.pan,
                playMode: padData.playMode,
                fadeIn: padData.fadeIn,
                fadeOut: padData.fadeOut,
                delay: padData.delay,
                soloGroup: padData.soloGroup || 'none'
            };
            store.put(dataToSave);
        }

        function loadPadsFromDB(bankId) {
            return new Promise((resolve) => {
                if (!db) return resolve([]);
                const transaction = db.transaction(['pads'], 'readonly');
                const store = transaction.objectStore('pads');
                const request = store.getAll();
                request.onsuccess = () => {
                    const allData = request.result;
                    // Filter by bankId
                    resolve(allData.filter(item => item.bankId === bankId));
                };
                request.onerror = () => resolve([]);
            });
        }

        function clearAllData() {
            if (!db) return;
            const transaction = db.transaction(['pads'], 'readwrite');
            const store = transaction.objectStore('pads');
            const request = store.clear();
            request.onsuccess = () => {
                window.location.reload();
            };
        }


        // --- Audio Engine (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Master Gain routing
        const masterGainNode = audioCtx.createGain();
        masterGainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
        masterGainNode.connect(audioCtx.destination);
        
        // Structure to manage pads and views
        const pads = {};
        let currentBankId = 1;
        let selectedPadId = null;
        let isEditMode = false;
        let isFaderMode = false;

        // Factory function for default settings
        function createDefaultPadState(id, bankId) {
            return {
                id: id,
                bankId: bankId,
                fileName: '',
                fileBlob: null,
                audioBuffer: null,
                volume: 1.0,
                pan: 0,
                playMode: 'shot',
                fadeIn: 0.0,
                fadeOut: 0.0,
                delay: 0.0,
                soloGroup: 'none',
                loopEnabled: false, // LOOP mode is now a boolean toggle
                
                // AudioNode instances currently active
                activeSources: [],
                status: 'idle', // 'idle', 'ready', 'playing', 'selecting', 'error'
                isPaused: false,
                pausedAt: 0,
                startedAt: 0
            };
        }

        // Initialize Web Audio graph and trigger playback
        async function triggerPad(pad) {
            if (!pad.audioBuffer) return;

            // Resume audioContext if it was suspended (browser security)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            // Clean up stopped sources before starting new
            pad.activeSources = pad.activeSources.filter(src => {
                if (src.ended) return false;
                return true;
            });

            // Handle Trigger modes
            if (pad.playMode === 'cue') {
                if (pad.status === 'playing') {
                    stopPad(pad);
                    return;
                }
            } else if (pad.playMode === 'pause') {
                if (pad.status === 'playing') {
                    pausePad(pad);
                    return;
                } else if (pad.isPaused) {
                    resumePad(pad);
                    return;
                }
            } else if (pad.playMode === 'shot' || pad.playMode === 'gate') {
                // For ONE SHOT / GATE, if already playing, stop current first to restart (re-trigger)
                if (pad.activeSources.length > 0) {
                    stopPad(pad, 0); // Stop instantly to restart
                }
            }

            // ソログループ排他停止の処理
            if (pad.soloGroup && pad.soloGroup !== 'none') {
                for (let i = 1; i <= 9; i++) {
                    if (i !== pad.id && pads[i] && pads[i].soloGroup === pad.soloGroup && pads[i].status === 'playing') {
                        stopPad(pads[i]); // 同じグループの音を自動停止
                    }
                }
            }

            playBuffer(pad);
        }

        function playBuffer(pad, offset = 0) {
            const source = audioCtx.createBufferSource();
            source.buffer = pad.audioBuffer;
            source.loop = pad.loopEnabled; // loop status is distinct from playMode trigger behavior

            // Create Node chains
            const gainNode = audioCtx.createGain();
            const pannerNode = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

            // Connect graph
            let lastNode = source;
            
            // Gain node (volume + fading)
            lastNode.connect(gainNode);
            lastNode = gainNode;

            // Stereo Panner (if supported)
            if (pannerNode) {
                pannerNode.pan.setValueAtTime(pad.pan, audioCtx.currentTime);
                lastNode.connect(pannerNode);
                lastNode = pannerNode;
            }

            // Route to global master gain node
            lastNode.connect(masterGainNode);

            // Handle Fade-In & Delay
            const now = audioCtx.currentTime;
            const delayTime = pad.delay;
            const startTime = now + delayTime;
            
            // Set initial volume and Fading state animation
            const el = document.getElementById(`pad-${pad.id}`);
            if (pad.fadeIn > 0) {
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(pad.volume, startTime + pad.fadeIn);
                
                // フェードイン中の早い点滅を適用
                if (el) {
                    el.classList.add('fading-blink');
                    setTimeout(() => {
                        if (pad.status === 'playing') {
                            el.classList.remove('fading-blink');
                        }
                    }, (delayTime + pad.fadeIn) * 1000);
                }
            } else {
                gainNode.gain.setValueAtTime(pad.volume, startTime);
                if (el) {
                    el.classList.remove('fading-blink');
                }
            }

            // Start playing
            source.start(startTime, offset);
            pad.startedAt = audioCtx.currentTime - offset + delayTime;
            pad.isPaused = false;

            const activeSrcInfo = {
                source: source,
                gainNode: gainNode,
                pannerNode: pannerNode,
                ended: false
            };

            // Monitor end of playback
            source.onended = () => {
                activeSrcInfo.ended = true;
                if (pad.activeSources.every(src => src.ended)) {
                    if (!pad.isPaused) {
                        setPadStatus(pad, 'ready');
                        updatePadProgress(pad, 0);
                        if (el) {
                            el.classList.remove('fading-blink');
                            el.classList.remove('paused-blink');
                        }
                        const elapsedEl = document.getElementById(`pad-time-elapsed-${pad.id}`);
                        const remainEl = document.getElementById(`pad-time-remain-${pad.id}`);
                        if (elapsedEl) elapsedEl.innerText = '0:00';
                        if (remainEl) remainEl.innerText = '-' + formatTime(pad.audioBuffer.duration);
                    }
                }
            };

            pad.activeSources.push(activeSrcInfo);
            setPadStatus(pad, 'playing');

            // Start progress indicator loop
            trackProgress(pad);
        }

        function stopPad(pad, customFadeOut = null) {
            const now = audioCtx.currentTime;
            const fadeOutDuration = customFadeOut !== null ? customFadeOut : pad.fadeOut;
            const el = document.getElementById(`pad-${pad.id}`);

            if (fadeOutDuration > 0 && pad.activeSources.some(src => !src.ended)) {
                // フェードアウト中アニメーション（早い点滅）
                if (el) {
                    el.classList.add('fading-blink');
                    el.classList.remove('paused-blink');
                }

                pad.activeSources.forEach(srcInfo => {
                    if (srcInfo.ended) return;
                    try {
                        srcInfo.gainNode.gain.setValueAtTime(srcInfo.gainNode.gain.value, now);
                        srcInfo.gainNode.gain.linearRampToValueAtTime(0, now + fadeOutDuration);
                        srcInfo.source.stop(now + fadeOutDuration);
                    } catch (e) {
                        console.warn('Source stop error: ', e);
                    }
                });

                // フェードアウト完了後の状態リセット
                setTimeout(() => {
                    pad.activeSources = [];
                    setPadStatus(pad, 'ready');
                    updatePadProgress(pad, 0);
                    if (el) {
                        el.classList.remove('fading-blink');
                    }
                    const elapsedEl = document.getElementById(`pad-time-elapsed-${pad.id}`);
                    const remainEl = document.getElementById(`pad-time-remain-${pad.id}`);
                    if (elapsedEl) elapsedEl.innerText = '0:00';
                    if (remainEl) remainEl.innerText = pad.audioBuffer ? '-' + formatTime(pad.audioBuffer.duration) : '--:--';
                }, fadeOutDuration * 1000);

            } else {
                // 即時停止
                pad.activeSources.forEach(srcInfo => {
                    if (srcInfo.ended) return;
                    try {
                        srcInfo.source.stop(now);
                    } catch (e) {
                        console.warn('Source stop error: ', e);
                    }
                });
                pad.activeSources = [];
                setPadStatus(pad, 'ready');
                updatePadProgress(pad, 0);
                if (el) {
                    el.classList.remove('fading-blink');
                    el.classList.remove('paused-blink');
                }
                const elapsedEl = document.getElementById(`pad-time-elapsed-${pad.id}`);
                const remainEl = document.getElementById(`pad-time-remain-${pad.id}`);
                if (elapsedEl) elapsedEl.innerText = '0:00';
                if (remainEl) remainEl.innerText = pad.audioBuffer ? '-' + formatTime(pad.audioBuffer.duration) : '--:--';
            }
            pad.isPaused = false;
        }

        function pausePad(pad) {
            if (pad.status !== 'playing' || pad.activeSources.length === 0) return;
            
            // Calculate paused position
            const elapsed = audioCtx.currentTime - pad.startedAt;
            pad.pausedAt = elapsed % pad.audioBuffer.duration;
            pad.isPaused = true;

            // 一時停止時はフェードなしで即停止
            stopPad(pad, 0); 
            
            // 状態を維持し、ゆっくり点滅
            setPadStatus(pad, 'ready'); // UI上はREADY枠にするが、再生情報があるためゆっくり点滅
            const el = document.getElementById(`pad-${pad.id}`);
            if (el) {
                el.classList.add('paused-blink');
            }
        }

        function resumePad(pad) {
            if (!pad.isPaused) return;
            const el = document.getElementById(`pad-${pad.id}`);
            if (el) {
                el.classList.remove('paused-blink');
            }
            playBuffer(pad, pad.pausedAt);
        }

        function trackProgress(pad) {
            if (pad.status !== 'playing' || pad.activeSources.length === 0) return;
            
            const duration = pad.audioBuffer.duration;
            const elapsed = audioCtx.currentTime - pad.startedAt;
            
            const elapsedEl = document.getElementById(`pad-time-elapsed-${pad.id}`);
            const remainEl = document.getElementById(`pad-time-remain-${pad.id}`);

            if (elapsed < 0) {
                // In delay period
                updatePadProgress(pad, 0);
                if (elapsedEl) elapsedEl.innerText = formatTime(0);
                if (remainEl) remainEl.innerText = '-' + formatTime(duration);
            } else {
                let percent = (elapsed / duration) * 100;
                let currentElapsed = elapsed;
                if (pad.loopEnabled) {
                    percent = percent % 100;
                    currentElapsed = elapsed % duration;
                }
                updatePadProgress(pad, percent);
                if (elapsedEl) elapsedEl.innerText = formatTime(currentElapsed);
                if (remainEl) remainEl.innerText = '-' + formatTime(Math.max(0, duration - currentElapsed));
            }

            if (pad.status === 'playing') {
                requestAnimationFrame(() => trackProgress(pad));
            }
        }


        // --- UI / Interaction Logic ---

        // 操作ガイドバーの更新ヘルパー
        function updateGuide() {
            const bar = document.getElementById('mode-guide-bar');
            const icon = document.getElementById('guide-icon');
            const text = document.getElementById('guide-text');
            if (!bar || !icon || !text) return;

            if (isEditMode) {
                bar.className = 'mode-guide-bar editing';
                icon.innerText = '⚙️';
                text.innerText = '編集モード：設定変更や音源登録をしたいパッドを選択（タップ）してください。空のパッドを選択すると音源を選択できます。';
                document.body.classList.add('mode-editing-active');
                document.body.classList.remove('mode-fading-active');
            } else if (isFaderMode) {
                bar.className = 'mode-guide-bar fader';
                icon.innerText = '🎚️';
                text.innerText = 'ミキサーモード：各パッド의音量・パン（定位）をスライダーで個別に調整します。CLOSEボタンで戻ります。';
                document.body.classList.add('mode-fading-active');
                document.body.classList.remove('mode-editing-active');
            } else {
                bar.className = 'mode-guide-bar';
                icon.innerText = '▶️';
                text.innerText = '演奏モード：パッドをタップ、またはテンキー[1〜9]で再生します。空のパッドをクリックすると自動で音源ロード画面が開きます。';
                document.body.classList.remove('mode-editing-active');
                document.body.classList.remove('mode-fading-active');
            }
        }

        // パッド押下時の処理 (マウス & テンキー共通)
        function handlePadPress(padId) {
            const pad = pads[padId];
            
            // 通常演奏モード時に空パッドが叩かれたら自動アシスト
            if (!isEditMode && !isFaderMode && pad.status === 'idle') {
                isEditMode = true;
                document.getElementById('btn-toggle-edit').classList.add('toggle-active');
                document.getElementById('main-workspace').classList.add('edit-waiting');
                updateGuide();
                
                selectPad(padId);
                document.getElementById('edit-modal').classList.remove('hidden');
                return;
            }
            
            // EDITモードの場合、設定モーダルを開く
            if (isEditMode) {
                selectPad(padId);
                document.getElementById('edit-modal').classList.remove('hidden');
                return;
            }

            if (pad.status === 'idle') {
                return;
            }

            selectPad(padId);
            pad.hasLongPressed = false;

            if (pad.status === 'playing' || pad.isPaused) {
                // 再生中または一時停止中の場合、ShotとPauseモードは長押し停止の対象
                if (pad.playMode === 'shot' || pad.playMode === 'pause') {
                    pad.longPressTimer = setTimeout(() => {
                        pad.hasLongPressed = true;
                        stopPad(pad); // 長押し停止を実行
                    }, 500); // 500ms長押し
                } else {
                    // Cueは押した瞬間に即動作（停止）
                    triggerPad(pad);
                }
            } else {
                // 停止中の場合は即再生
                triggerPad(pad);
            }
        }

        // パッド解放時の処理 (マウス & テンキー共通)
        function handlePadRelease(padId) {
            const pad = pads[padId];
            if (!pad.audioBuffer) return;

            // タイマークリア
            if (pad.longPressTimer) {
                clearTimeout(pad.longPressTimer);
                pad.longPressTimer = null;
            }

            // 長押しが既に発火済みの場合はタップ挙動をキャンセル
            if (pad.hasLongPressed) {
                pad.hasLongPressed = false;
                return;
            }

            // 短押し（タップ）の挙動
            if (pad.playMode === 'gate') {
                stopPad(pad);
            } else if (pad.playMode === 'shot') {
                if (pad.status === 'playing') {
                    // 連打時は頭から再スタート（トリガー）
                    triggerPad(pad);
                }
            } else if (pad.playMode === 'pause') {
                if (pad.status === 'playing' || pad.isPaused) {
                    // 再生中なら一時停止、一時停止中なら再開
                    triggerPad(pad);
                }
            }
        }

        // Render sampler pads in 3x3 layout
        function buildGrid() {
            const grid = document.getElementById('sampler-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 9; i++) {
                const padId = i;
                const pad = pads[padId];
                
                const padEl = document.createElement('div');
                padEl.className = 'pad status-idle';
                padEl.id = `pad-${padId}`;
                padEl.innerHTML = `
                    <div class="pad-header">
                        <span class="pad-number">${padId}</span>
                        <span class="pad-badge" id="pad-badge-${padId}">EMPTY</span>
                    </div>
                    <div class="pad-body">
                        <span class="pad-title" id="pad-title-${padId}">TAP TO LOAD AUDIO</span>
                    </div>
                    <div class="pad-footer" style="display: flex; flex-direction: column; gap: 4px; align-items: center; width: 100%;">
                        <div style="display: flex; justify-content: space-between; width: 100%; font-size: 10px;">
                            <span class="pad-time" id="pad-time-elapsed-${padId}">0:00</span>
                            <span class="pad-time" id="pad-time-remain-${padId}">--:--</span>
                        </div>
                        <span class="pad-mode-indicator" id="pad-mode-${padId}">SHOT</span>

                padEl.addEventListener('mousedown', (e) => {
                    if (e.shiftKey) {
                        selectPad(padId);
                        return;
                    }
                    handlePadPress(padId);
                });

                // Handle MouseUp
                padEl.addEventListener('mouseup', () => {
                    handlePadRelease(padId);
                });
                
                padEl.addEventListener('mouseleave', () => {
                    handlePadRelease(padId);
                });

                grid.appendChild(padEl);
            }
        }

        function setPadStatus(pad, status) {
            pad.status = status;
            const el = document.getElementById(`pad-${pad.id}`);
            if (el) {
                el.className = 'pad'; // reset
                el.classList.add(`status-${status}`);
                
                // Remove pause indicators if not paused
                if (!pad.isPaused) {
                    el.classList.remove('paused-blink');
                }
            }

            // Sync cue button on fader channel
            updateFaderCueBtnStatus(pad);
        }

        function updatePadProgress(pad, percent) {
            const bar = document.getElementById(`pad-progress-${pad.id}`);
            if (bar) {
                bar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
            }
        }

        function selectPad(padId) {
            // Unselect previous
            if (selectedPadId && pads[selectedPadId]) {
                const prevPad = pads[selectedPadId];
                if (prevPad.status === 'selecting') {
                    setPadStatus(prevPad, prevPad.audioBuffer ? 'ready' : 'idle');
                }
            }

            selectedPadId = padId;
            const pad = pads[padId];
            
            if (pad.status === 'idle' || pad.status === 'ready') {
                setPadStatus(pad, 'selecting');
            }

            // Update setting panel details
            document.getElementById('selected-pad-title').innerText = `PAD ${padId} SETTINGS`;
            
            // Update dropzone UI
            const dropzoneText = document.querySelector('.dropzone-text');
            if (pad.fileName) {
                dropzoneText.innerText = pad.fileName;
            } else {
                dropzoneText.innerHTML = 'Audioファイルをドロップ<br>またはクリックして選択';
            }

            // Sync modal controls
            document.querySelectorAll('.mode-btn').forEach(btn => {
                if (btn.dataset.mode === pad.playMode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            document.getElementById('checkbox-loop').checked = pad.loopEnabled;
            document.getElementById('select-sologroup').value = pad.soloGroup || 'none';
            
            document.getElementById('slider-volume').value = pad.volume;
            document.getElementById('val-volume').innerText = `${Math.round(pad.volume * 100)}%`;
            
            document.getElementById('slider-pan').value = pad.pan;
            updatePanLabel(pad.pan);

            document.getElementById('slider-fadein').value = pad.fadeIn;
            document.getElementById('val-fadein').innerText = `${pad.fadeIn.toFixed(1)}s`;

            document.getElementById('slider-fadeout').value = pad.fadeOut;
            document.getElementById('val-fadeout').innerText = `${pad.fadeOut.toFixed(1)}s`;

            document.getElementById('slider-delay').value = pad.delay;
            document.getElementById('val-delay').innerText = `${pad.delay.toFixed(1)}s`;
        }

        function updatePanLabel(value) {
            const valLabel = document.getElementById('val-pan');
            if (value === 0) valLabel.innerText = 'Center';
            else if (value < 0) valLabel.innerText = `L ${Math.abs(Math.round(value * 10))}`;
            else valLabel.innerText = `R ${Math.round(value * 10)}`;
        }

        // Format duration helper
        function formatTime(seconds) {
            if (isNaN(seconds)) return '--:--';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Handle Audio Decoding and Setup
        async function loadAudioFile(file, padId) {
            const pad = pads[padId];
            setPadStatus(pad, 'idle'); // show loading state
            
            const badge = document.getElementById(`pad-badge-${padId}`);
            const title = document.getElementById(`pad-title-${padId}`);
            const elapsedEl = document.getElementById(`pad-time-elapsed-${padId}`);
            const remainEl = document.getElementById(`pad-time-remain-${padId}`);
            
            title.innerText = 'Loading...';

            try {
                // Decode Audio
                const arrayBuffer = await file.arrayBuffer();
                pad.audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                // Store file metadata
                pad.fileName = file.name;
                pad.fileBlob = file; // Save full Blob inside IndexedDB

                badge.innerText = file.type.split('/')[1]?.toUpperCase() || 'AUDIO';
                title.innerText = file.name;
                if (elapsedEl) elapsedEl.innerText = '0:00';
                if (remainEl) remainEl.innerText = '-' + formatTime(pad.audioBuffer.duration);

                setPadStatus(pad, 'ready');

                // Save to database
                savePadToDB(pad);
                
                // Sync fader levels UI
                const volSlider = document.getElementById(`fader-vol-${padId}`);
                if (volSlider) volSlider.value = pad.volume;
                
                // Select to refresh sidebar settings
                if (selectedPadId === padId) {
                    selectPad(padId);
                }
            } catch (err) {
                console.error(err);
                title.innerText = 'Error decoding audio';
                setPadStatus(pad, 'error');
            }
        }


        // --- Mixer (Fader View) dynamic build and sync ---

        function buildFaders() {
            const container = document.getElementById('fader-channels-list');
            container.innerHTML = '';

            for (let i = 1; i <= 9; i++) {
                const padId = i;
                const channelEl = document.createElement('div');
                channelEl.className = 'fader-channel';
                channelEl.innerHTML = `
                    <div class="fader-pan-wrap">
                        <span class="fader-pan-label" id="fader-pan-val-${padId}">C</span>
                        <input type="range" class="fader-pan-slider" id="fader-pan-${padId}" min="-1" max="1" step="0.1" value="0">
                    </div>
                    <div class="fader-slider-wrap">
                        <input type="range" id="fader-vol-${padId}" min="0" max="1" step="0.01" value="1">
                    </div>
                    <button class="fader-cue-btn status-idle" id="fader-cue-${padId}">CUE</button>
                    <span class="fader-channel-num">${padId}</span>
                `;

                // Volume slider logic
                const volSlider = channelEl.querySelector(`#fader-vol-${padId}`);
                volSlider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    if (pads[padId]) {
                        pads[padId].volume = val;
                        pads[padId].activeSources.forEach(src => {
                            if (!src.ended) src.gainNode.gain.setValueAtTime(val, audioCtx.currentTime);
                        });
                        savePadToDB(pads[padId]);
                        
                        if (selectedPadId === padId) {
                            document.getElementById('slider-volume').value = val;
                            document.getElementById('val-volume').innerText = `${Math.round(val * 100)}%`;
                        }
                    }
                });

                // Pan slider logic
                const panSlider = channelEl.querySelector(`#fader-pan-${padId}`);
                panSlider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    updateFaderPanLabel(padId, val);
                    if (pads[padId]) {
                        pads[padId].pan = val;
                        pads[padId].activeSources.forEach(src => {
                            if (!src.ended && src.pannerNode) {
                                src.pannerNode.pan.setValueAtTime(val, audioCtx.currentTime);
                            }
                        });
                        savePadToDB(pads[padId]);
                        
                        if (selectedPadId === padId) {
                            document.getElementById('slider-pan').value = val;
                            updatePanLabel(val);
                        }
                    }
                });

                // Cue button trigger logic
                const cueBtn = channelEl.querySelector(`#fader-cue-${padId}`);
                cueBtn.addEventListener('mousedown', () => {
                    handlePadPress(padId);
                });
                cueBtn.addEventListener('mouseup', () => {
                    handlePadRelease(padId);
                });
                cueBtn.addEventListener('mouseleave', () => {
                    handlePadRelease(padId);
                });

                container.appendChild(channelEl);
            }
        }

        function updateFaderPanLabel(padId, value) {
            const el = document.getElementById(`fader-pan-val-${padId}`);
            if (!el) return;
            if (value === 0) el.innerText = 'C';
            else if (value < 0) el.innerText = `L${Math.abs(Math.round(value * 10))}`;
            else el.innerText = `R${Math.round(value * 10)}`;
        }

        function syncFadersUI() {
            for (let i = 1; i <= 9; i++) {
                const pad = pads[i];
                if (!pad) continue;
                
                const volSlider = document.getElementById(`fader-vol-${i}`);
                if (volSlider) volSlider.value = pad.volume;
                
                const panSlider = document.getElementById(`fader-pan-${i}`);
                if (panSlider) {
                    panSlider.value = pad.pan;
                    updateFaderPanLabel(i, pad.pan);
                }
                updateFaderCueBtnStatus(pad);
            }
        }

        function updateFaderCueBtnStatus(pad) {
            const btn = document.getElementById(`fader-cue-${pad.id}`);
            if (!btn) return;
            btn.className = `fader-cue-btn status-${pad.status}`;
            if (pad.isPaused) {
                btn.classList.add('paused-blink');
            } else {
                btn.classList.remove('paused-blink');
            }
        }


        // --- Event Listeners and initialization ---

        // バンクの切り替えとデータ再読み込みを行う共通関数
        async function switchBank(bankId) {
            currentBankId = bankId;
            
            // 1. 再生中の音声をすべて停止
            for (let i = 1; i <= 9; i++) {
                if (pads[i]) {
                    stopPad(pads[i], 0); // フェードなしで即時停止
                }
            }

            // 2. パッド状態の初期化
            for (let i = 1; i <= 9; i++) {
                pads[i] = createDefaultPadState(i, currentBankId);
            }

            // 3. UIの初期化（空の状態で一旦ビルド）
            buildGrid();
            buildFaders();

            // 4. 新しいバンクのデータを IndexedDB からロード
            const savedPads = await loadPadsFromDB(currentBankId);
            for (const savedData of savedPads) {
                const pad = pads[savedData.id];
                pad.volume = savedData.volume;
                pad.pan = savedData.pan;
                pad.playMode = savedData.playMode;
                pad.fadeIn = savedData.fadeIn;
                pad.fadeOut = savedData.fadeOut;
                pad.delay = savedData.delay;
                pad.soloGroup = savedData.soloGroup || 'none';
                pad.loopEnabled = savedData.loopEnabled || false;
                pad.fileName = savedData.fileName;
                pad.fileBlob = savedData.fileBlob;

                if (pad.fileBlob) {
                    try {
                        const arrayBuffer = await pad.fileBlob.arrayBuffer();
                        pad.audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                        
                        // UI要素の更新
                        const badge = document.getElementById(`pad-badge-${pad.id}`);
                        const title = document.getElementById(`pad-title-${pad.id}`);
                        const elapsedEl = document.getElementById(`pad-time-elapsed-${pad.id}`);
                        const remainEl = document.getElementById(`pad-time-remain-${pad.id}`);
                        const mode = document.getElementById(`pad-mode-${pad.id}`);
                        
                        if (badge) badge.innerText = pad.fileBlob.type.split('/')[1]?.toUpperCase() || 'AUDIO';
                        if (title) title.innerText = pad.fileName;
                        if (elapsedEl) elapsedEl.innerText = '0:00';
                        if (remainEl) remainEl.innerText = '-' + formatTime(pad.audioBuffer.duration);
                        
                        // Update bottom status badges
                        let modeBadgeText = pad.playMode.toUpperCase();
                        if (pad.loopEnabled) modeBadgeText += ' (L)';
                        if (pad.soloGroup !== 'none') modeBadgeText += ` GRP:${pad.soloGroup}`;
                        if (mode) mode.innerText = modeBadgeText;

                        setPadStatus(pad, 'ready');
                    } catch (e) {
                        console.error('Auto decode failed: ', e);
                        setPadStatus(pad, 'error');
                    }
                }
            }

            // Sync faders sliders to bank config
            syncFadersUI();

            // 5. 選択パッドの初期化
            selectPad(1);
        }

            // Keyboard mappings (1 to 9 Numpad support)
            const keyMap = {
                '1': 7, '2': 8, '3': 9, // Bottom row
                '4': 4, '5': 5, '6': 6, // Mid row
                '7': 1, '8': 2, '9': 3  // Top row

                const padId = keyMap[e.key];
                if (padId && pads[padId]) {
                    const pad = pads[padId];
                    // Keyboard bypasses UI mode and always triggers play/stop
                    if (pad.status !== 'idle' && !e.repeat) {
                        handlePadPress(padId);
                    }
                }
            });
            
            document.addEventListener('keyup', (e) => {
                const padId = keyMap[e.key];
                if (padId && pads[padId]) {
                    handlePadRelease(padId);
                }
            });
        });
    </script>
</body>
</html>
